services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve_diagnostics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve_diagnostics"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://eve:eve@db:5432/eve_diagnostics"
      SECRET_KEY: "change-me-in-production"
      WEBHOOK_SECRET: "webhook-shared-secret"
      PAYMENT_SUCCESS_RATE: "1.0"
      DEBUG: "true"
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
